name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Compile App with Embedded Info.plist
        run: |
          # 1. Initialize a clean Swift Package layout
          mkdir -p WatchBuild
          cd WatchBuild
          swift package init --type executable
          
          # 2. Swap out the template file with your code
          rm -f Sources/WatchBuild/WatchBuild.swift
          cp ../app.swift Sources/WatchBuild/main.swift
          
          # 3. Create a valid Info.plist payload layout mapping
          cat <<EOF > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WatchUnlocker</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>10.0</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 4. Compile and embed the Info.plist into the binary segment
          swift build -c release -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker Info.plist

          # 5. Package the compiled binary asset into an installable application wrap
          mkdir -p ../Payload/WatchUnlockerApp.app
          cp .build/release/WatchBuild ../Payload/WatchUnlockerApp.app/WatchUnlocker
          cp Info.plist ../Payload/WatchUnlockerApp.app/Info.plist
          cd ..
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa
