name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Generate and Compile Xcode Project
        run: |
          # 1. Create a structured iOS/watchOS application folder
          mkdir -p WatchUnlocker/WatchUnlocker
          
          # 2. Put your App.swift file into the project source folder
          cp App.swift WatchUnlocker/WatchUnlocker/App.swift
          
          # 3. Use an automation script to build the project without needing a pre-existing project file
          cd WatchUnlocker
          
          # We use single-file swift compilation targeted specifically at the watchOS framework architecture
          xcrun -sdk watchos swiftc WatchUnlocker/App.swift \
            -target arm64_32-apple-watchos6.0 \
            -sdk $(xcrun --sdk watchos --show-sdk-path) \
            -emit-executable \
            -o WatchUnlockerApp
            
          # 4. Pack it inside an App bundle container layout
          mkdir -p WatchUnlockerApp.app
          mv WatchUnlockerApp WatchUnlockerApp.app/WatchUnlockerApp
          
          # 5. Build a comprehensive Info.plist mapping out the watch app properties
          cat <<EOF > WatchUnlockerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>6.0</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 6. Archive everything into a standard installation Payload package
          mkdir -p ../Payload
          cp -r WatchUnlockerApp.app ../Payload/
          cd ..
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa
