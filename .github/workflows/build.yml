name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create and Build Xcode Project
        run: |
          # 1. Create a minimal command-line project layout using Swift Package Manager
          mkdir -p WatchUnlockerProject
          cd WatchUnlockerProject
          swift package init --type executable
          
          # 2. Move your App.swift code into the compilation source directory
          rm Sources/main.swift
          cp ../App.swift Sources/App.swift
          
          # 3. Use xcodebuild to properly compile the target for watchOS 
          # This handles all framework linking (SwiftUI, WatchKit, CoreBluetooth) automatically
          xcodebuild -buildwithpackages \
            -scheme WatchUnlockerProject \
            -destination 'generic/platform=watchOS' \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=../build
            
          # 4. Bundle the resulting executable package into a deployable IPA
          cd ..
          mkdir -p Payload/WatchUnlockerApp.app
          cp build/WatchUnlockerProject Payload/WatchUnlockerApp.app/WatchUnlockerApp
          
          # 5. Generate a valid Info.plist inside the app bundle
          cat <<EOF > Payload/WatchUnlockerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Zip everything into the final installable file
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa
