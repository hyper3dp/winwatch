name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install Project Generator
        run: brew install xcodegen

      - name: Configure and Compile watchOS 26 Target
        run: |
          # 1. Create a definition file instructing Xcode how to link SwiftUI and CoreBluetooth
          cat <<EOF > project.yml
          name: WatchUnlocker
          options:
            bundleIdPrefix: com.custom
          targets:
            WatchUnlockerApp:
              type: watchkitapp
              platform: watchOS
              deploymentTarget: "10.0"
              sources: [app.swift]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.custom.WatchUnlockerApp
                INFOPLIST_FILE: Info.plist
          EOF

          # 2. Generate a standard Info.plist matching watchOS system environments
          cat <<EOF > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>\$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 3. Automatically build the standard project infrastructure
          xcodegen generate

          # 4. Use native Apple tools to compile the workspace target into a binary
          xcodebuild -project WatchUnlocker.xcodeproj \
            -scheme WatchUnlockerApp \
            -destination 'generic/platform=watchOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          # 5. Package the resulting build assets into an installable application container
          mkdir -p Payload
          cp -r build/Release-watchos/WatchUnlockerApp.app Payload/
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa

