name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Compile App via Swift Package Manager
        run: |
          # 1. Initialize a clean Swift Package layout
          mkdir -p WatchBuild
          cd WatchBuild
          swift package init --type executable
          
          # 2. Swap out the template main file with your Apple Watch code
          rm Sources/main.swift
          cp ../app.swift Sources/main.swift
          
          # 3. Compile the target binary cleanly using native macOS SPM pipelines
          swift build -c release

          # 4. Package the compiled app binary into a deployable installer layout
          mkdir -p ../Payload/WatchUnlocker.app
          cp .build/release/WatchBuild ../Payload/WatchUnlocker.app/WatchUnlocker
          cd ..
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa

