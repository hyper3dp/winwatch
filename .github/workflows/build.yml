name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      # 1. Using an updated version that natively supports Node 24
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Swift WatchOS Project Structure
        run: |
          # Create a proper Apple Watch app bundle layout
          mkdir -p WatchUnlockerApp.app
          
          # Compile the Swift code using the standard watchos framework deployment target
          xcrun -sdk watchos swiftc App.swift \
            -target arm64_32-apple-watchos6.0 \
            -o WatchUnlockerApp.app/WatchUnlockerApp \
            -parse-as-library
            
          # Generate a minimal valid Info.plist so the Watch can parse the binary
          cat <<EOF > WatchUnlockerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Pack it up into a standard installation Payload structure
          mkdir -p Payload
          cp -r WatchUnlockerApp.app Payload/
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa
