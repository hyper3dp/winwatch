name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Build watchOS Bundle Structure
        run: |
          # 1. Create standard application folder layout
          mkdir -p WatchUnlockerApp.app
          
          # 2. Compile file with core Apple SDK linking parameters
          xcrun -sdk watchos swiftc app.swift \
            -target arm64_32-apple-watchos10.0 \
            -sdk $(xcrun --sdk watchos --show-sdk-path) \
            -o WatchUnlockerApp.app/WatchUnlockerApp \
            -parse-as-library
            
          # 3. Create structural Info.plist configuration
          cat <<EOF > WatchUnlockerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>10.0</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 4. Wrap the app wrapper inside a standard device installer container
          mkdir -p Payload
          cp -r WatchUnlockerApp.app Payload/
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa
