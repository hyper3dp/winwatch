name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Swift watchOS 26 Project Structure
        run: |
          # 1. Create a structured watchOS application folder container
          mkdir -p WatchUnlockerApp.app
          
          # 2. Compile the swift code pointing explicitly at the modern watchOS 26 target runtime
          xcrun -sdk watchos swiftc app.swift \
            -target arm64_32-apple-watchos26.0 \
            -sdk $(xcrun --sdk watchos --show-sdk-path) \
            -o WatchUnlockerApp.app/WatchUnlockerApp \
            -parse-as-library
            
          # 3. Generate a standard Info.plist mapped for modern watch environments
          cat <<EOF > WatchUnlockerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>26.0</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 4. Pack it inside an installation Payload archive directory
          mkdir -p Payload
          cp -r WatchUnlockerApp.app Payload/
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa
