name: Build Watch App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Suppress Node runtime errors by explicitly confirming Node 24 execution patterns
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Build Application Payload
        run: |
          # 1. Initialize a build directory
          mkdir -p WatchUnlockerApp.app
          
          # 2. Compile directly into the watchOS 26 target while linking systemic frameworks
          xcrun -sdk watchos swiftc app.swift \
            -target arm64_32-apple-watchos26.0 \
            -sdk $(xcrun --sdk watchos --show-sdk-path) \
            -Xfrontend -serialize-debugging-options \
            -o WatchUnlockerApp.app/WatchUnlockerApp \
            -parse-as-library
            
          # 3. Create a strict structure configuration profile
          cat <<EOF > WatchUnlockerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.WatchUnlockerApp</string>
              <key>CFBundleName</key>
              <string>WatchUnlockerApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>26.0</string>
              <key>WKWatchKitApp</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 4. Packaging the distribution executable
          mkdir -p Payload
          cp -r WatchUnlockerApp.app Payload/
          zip -r WatchUnlocker.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: AppleWatchApp
          path: WatchUnlocker.ipa
